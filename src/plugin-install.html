<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="editor.css" />
    <link rel="stylesheet" href="plugin-install.css" />
  </head>
  <body>
    <form id="form" autocomplete="off">
      <h1>プラグインを追加</h1>

      <section>
        <h2>公式プラグイン</h2>
        <ul id="official" class="official">
          <li class="note">読み込み中…</li>
        </ul>
        <small id="offline" hidden>一覧を取得できなかったので、このアプリに入っている一覧を出しています</small>
      </section>

      <label>
        GitHub のリポジトリから
        <span class="row">
          <input id="repo" spellcheck="false" placeholder="例: knagato/mxdeck-plugin-login-helper" />
          <button type="submit" id="run">ダウンロード</button>
        </span>
        <small>owner/repo か GitHub の URL。ブランチ・タグは #v1.0 のように後ろに付けます（無ければ既定のブランチ）</small>
      </label>

      <p id="error" class="error" hidden></p>

      <div class="actions">
        <button type="button" id="cancel">閉じる</button>
      </div>
    </form>
    <script src="plugin-install.js"></script>
  </body>
</html>
